    "title": "Sales & Data Quality Platform",
    "version": "1.1.0",
    "description": "Complete MVP. Mutations require Origin matching APP_ORIGIN and X-Requested-With: SalesPlatform. HttpOnly PostgreSQL-backed sessions. Ownership, pagination, filters and errors follow docs/data-contract.md. Import processing runs in a durable background queue in the API process."
