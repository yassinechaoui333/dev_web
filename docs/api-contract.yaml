              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "description": "ADMIN only; may change another account role or active flag. Self role/status changes return 409 SELF_CHANGE_FORBIDDEN. Changes revoke target sessions and create an audit record. Last active admin cannot be removed. Rechecks actor session/role inside the account transaction."
      }
