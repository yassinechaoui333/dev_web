name: Foundation checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sales
          POSTGRES_PASSWORD: sales_local_only
          POSTGRES_DB: sales_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U sales -d sales_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sales:sales_local_only@localhost:5432/sales_test?schema=public
      APP_ORIGIN: http://localhost:5173
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: DevAdmin123!
      SEED_USER_PASSWORD: DevMember123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npm test
