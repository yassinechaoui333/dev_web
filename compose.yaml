services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales_local_only
      POSTGRES_DB: sales
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: ["sales_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  sales_pg:
